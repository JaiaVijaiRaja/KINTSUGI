<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Ceramic Porcelain Surface Gradient -->
    <linearGradient id="ceramicSurface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFFFFF" />
      <stop offset="40%" stopColor="#FDFBF7" />
      <stop offset="75%" stopColor="#F5F1E8" />
      <stop offset="100%" stopColor="#EAE4D8" />
    </linearGradient>

    <!-- Ceramic Edge Rim Stroke -->
    <linearGradient id="ceramicBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFFFFF" />
      <stop offset="50%" stopColor="#E5DFD3" />
      <stop offset="100%" stopColor="#C8C0B0" />
    </linearGradient>

    <!-- Radiant Molten Gold Gradient for Kintsugi Seams -->
    <linearGradient id="kintsugiGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFF9DB" />
      <stop offset="25%" stopColor="#FBBF24" />
      <stop offset="55%" stopColor="#F59E0B" />
      <stop offset="85%" stopColor="#D97706" />
      <stop offset="100%" stopColor="#92400E" />
    </linearGradient>

    <!-- Pure Golden Highlight Gleam -->
    <linearGradient id="goldGleam" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#F59E0B" />
      <stop offset="50%" stopColor="#FEF3C7" />
      <stop offset="100%" stopColor="#D97706" />
    </linearGradient>

    <!-- Deep Metallic Shadow for Lacquer Underlayer -->
    <linearGradient id="goldShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#78350F" />
      <stop offset="100%" stopColor="#451A03" />
    </linearGradient>

    <!-- Soft Ceramic Drop Shadow -->
    <filter id="tileShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.18" />
    </filter>

    <!-- Golden Aura Glow for Kintsugi Repair -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0.8" stdDeviation="1.2" flood-color="#D97706" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Base Ceramic White Tile -->
  <rect
    x="3"
    y="3"
    width="58"
    height="58"
    rx="15"
    fill="url(#ceramicSurface)"
    stroke="url(#ceramicBorder)"
    stroke-width="1.8"
    filter="url(#tileShadow)"
  />

  <!-- Subtle Glaze Gloss Highlight on Top Rim -->
  <path
    d="M 6 18 C 6 10, 10 6, 18 6 L 46 6 C 54 6, 58 10, 58 18"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="1.2"
    stroke-linecap="round"
    opacity="0.85"
  />

  <!-- Authentic Ceramic Fracture Fissures (Fine hairline cracks under the gold) -->
  <path
    d="M 20 12 L 14 8"
    fill="none"
    stroke="#D1C8B8"
    stroke-width="0.8"
    stroke-linecap="round"
    opacity="0.6"
  />
  <path
    d="M 44 14 L 52 10"
    fill="none"
    stroke="#D1C8B8"
    stroke-width="0.8"
    stroke-linecap="round"
    opacity="0.6"
  />
  <path
    d="M 45 49 L 53 54"
    fill="none"
    stroke="#D1C8B8"
    stroke-width="0.8"
    stroke-linecap="round"
    opacity="0.6"
  />
  <path
    d="M 19 51 L 13 56"
    fill="none"
    stroke="#D1C8B8"
    stroke-width="0.8"
    stroke-linecap="round"
    opacity="0.6"
  />
  <path
    d="M 33 22 L 41 26"
    fill="none"
    stroke="#D97706"
    stroke-width="1"
    stroke-linecap="round"
    opacity="0.45"
  />

  <!-- ======================================================== -->
  <!-- STYLIZED KINTSUGI "K" — GOLDEN REPAIR EMBLEM              -->
  <!-- ======================================================== -->

  <!-- Shadow Underlayer for Tactile Depth -->
  <g stroke="url(#goldShadow)" stroke-linecap="round" stroke-linejoin="round" opacity="0.35">
    <!-- Vertical stem shadow -->
    <path d="M 21.5 13.5 L 21.5 51.5" stroke-width="5.8" />
    <!-- Upper diagonal arm shadow -->
    <path d="M 21.5 32.5 L 44.5 14.5" stroke-width="5.2" />
    <!-- Lower diagonal arm shadow -->
    <path d="M 21.5 32.5 L 45.5 49.5" stroke-width="5.2" />
  </g>

  <!-- Molten Gold K Main Body with Radiant Glow -->
  <g filter="url(#goldGlow)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Vertical K Stem: Organic kintsugi golden line with slight fracture kink -->
    <path
      d="M 21 13 L 21 30.5 L 20.5 33 L 21 51"
      stroke="url(#kintsugiGold)"
      stroke-width="5.2"
      fill="none"
    />

    <!-- Upper Diagonal Arm of the K -->
    <path
      d="M 21 31.5 L 31 23 L 44 14"
      stroke="url(#kintsugiGold)"
      stroke-width="4.8"
      fill="none"
    />

    <!-- Lower Diagonal Arm of the K -->
    <path
      d="M 21 31.5 L 32 39.5 L 45 49"
      stroke="url(#kintsugiGold)"
      stroke-width="4.8"
      fill="none"
    />
  </g>

  <!-- Fine Gleam Center Highlight Lines (Inner golden shine) -->
  <g stroke="url(#goldGleam)" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 21 14.5 L 21 49.5" stroke-width="1.8" />
    <path d="M 22 30.5 L 43 14.5" stroke-width="1.6" />
    <path d="M 22 32.5 L 44 48.5" stroke-width="1.6" />
  </g>

  <!-- Golden Junction Nexus Node (Where the ceramic shards meet) -->
  <circle
    cx="21"
    cy="31.5"
    r="3.4"
    fill="url(#goldGleam)"
    stroke="#D97706"
    stroke-width="0.8"
  />

  <!-- Top-Right Accent Golden Droplet -->
  <circle
    cx="44"
    cy="14"
    r="2.2"
    fill="#FEF3C7"
    stroke="#B45309"
    stroke-width="0.6"
  />

  <!-- Bottom-Right Accent Golden Droplet -->
  <circle
    cx="45"
    cy="49"
    r="2.2"
    fill="#FEF3C7"
    stroke="#B45309"
    stroke-width="0.6"
  />
</svg>